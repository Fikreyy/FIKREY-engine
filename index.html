<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIKREY - Media Intelligence Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/30">F</div>
      <span class="text-xl font-bold tracking-tight text-white">FIKREY <span class="text-indigo-400 text-sm font-medium">Intelligence</span></span>
    </div>
    <div class="text-xs text-slate-400 bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700">
      Status: <span class="text-emerald-400 font-semibold">Live Ingestion Active</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
      <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-5">
        <p class="text-xs uppercase font-semibold text-slate-400 mb-1">Zbadane odcinki</p>
        <h3 id="stat-total" class="text-2xl font-bold text-white">-</h3>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-5">
        <p class="text-xs uppercase font-semibold text-slate-400 mb-1">Wykryci sponsorzy</p>
        <h3 id="stat-sponsors" class="text-2xl font-bold text-indigo-400">-</h3>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-5">
        <p class="text-xs uppercase font-semibold text-slate-400 mb-1">Średni Brand Safety</p>
        <h3 id="stat-safety" class="text-2xl font-bold text-emerald-400">-</h3>
      </div>
      <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-5">
        <p class="text-xs uppercase font-semibold text-slate-400 mb-1">Aktywne rynki UE</p>
        <h3 id="stat-countries" class="text-2xl font-bold text-amber-400">-</h3>
      </div>
    </div>

    <div class="flex flex-col md:flex-row gap-4 mb-6">
      <div class="flex-1">
        <input type="text" id="searchInput" placeholder="Szukaj sponsora, podcastu lub hasła..." 
               class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
      </div>
      <select id="countryFilter" class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-300 focus:outline-none focus:border-indigo-500">
        <option value="ALL">Wszystkie rynki (UE)</option>
      </select>
    </div>

    <div class="bg-slate-900/60 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm">
          <thead class="bg-slate-900 border-b border-slate-800 text-xs font-semibold text-slate-400 uppercase">
            <tr>
              <th class="py-4 px-6">Rynek</th>
              <th class="py-4 px-6">Podcast i Odcinek</th>
              <th class="py-4 px-6">Sponsor / Kampania</th>
              <th class="py-4 px-6">Brand Safety</th>
              <th class="py-4 px-6">Monetyzacja</th>
              <th class="py-4 px-6">Profil widowni</th>
            </tr>
          </thead>
          <tbody id="episodesTable" class="divide-y divide-slate-800/60">
            <tr>
              <td colspan="6" class="text-center py-10 text-slate-500">Ładowanie danych...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    let allData = [];

    async function loadData() {
      const endpoints = [
        'baza_odcinkow.json',
        './baza_odcinkow.json',
        'https://api.github.com/repos/fikreyy/FIKREY-engine/contents/baza_odcinkow.json'
      ];

      for (let url of endpoints) {
        try {
          const res = await fetch(url);
          if (!res.ok) continue;
          
          if (url.includes('api.github.com')) {
            const jsonMeta = await res.json();
            const decoded = decodeURIComponent(escape(atob(jsonMeta.content)));
            allData = JSON.parse(decoded);
          } else {
            allData = await res.json();
          }

          if (allData && allData.length > 0) {
            setupFilters();
            updateStats(allData);
            renderTable(allData);
            return;
          }
        } catch (e) {
          console.warn('Próba ładowania nieudana:', url);
        }
      }

      document.getElementById('episodesTable').innerHTML = `
        <tr><td colspan="6" class="text-center py-8 text-rose-400">Brak danych w bazie. Uruchom workflow w zakładce Actions.</td></tr>
      `;
    }

    function setupFilters() {
      const countries = [...new Set(allData.map(d => d.kraj).filter(Boolean))];
      const select = document.getElementById('countryFilter');
      countries.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = `Kraj: ${c}`;
        select.appendChild(opt);
      });
    }

    function updateStats(data) {
      document.getElementById('stat-total').textContent = data.length;
      const sponsorsCount = data.filter(d => d.sponsorzy && d.sponsorzy !== 'Brak' && d.sponsorzy !== '-').length;
      document.getElementById('stat-sponsors').textContent = sponsorsCount;
      
      const safetyAvg = Math.round(data.reduce((acc, curr) => acc + (parseInt(curr.brand_safety_score) || 90), 0) / (data.length || 1));
      document.getElementById('stat-safety').textContent = `${safetyAvg}/100`;

      const countriesCount = new Set(data.map(d => d.kraj)).size;
      document.getElementById('stat-countries').textContent = countriesCount;
    }

    function renderTable(data) {
      const tbody = document.getElementById('episodesTable');
      tbody.innerHTML = data.map(item => {
        const score = parseInt(item.brand_safety_score) || 90;
        let scoreBadge = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
        if (score < 70) scoreBadge = 'bg-rose-500/10 text-rose-400 border-rose-500/20';
        else if (score < 90) scoreBadge = 'bg-amber-500/10 text-amber-400 border-amber-500/20';

        const sponsorBadge = item.sponsorzy && item.sponsorzy !== 'Brak'
          ? `<span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">${item.sponsorzy}</span>`
          : `<span class="text-slate-500 text-xs">Brak</span>`;

        return `
          <tr class="hover:bg-slate-800/40 transition">
            <td class="py-4 px-6 font-semibold text-slate-300"><span class="px-2 py-1 bg-slate-800 rounded text-xs border border-slate-700">${item.kraj || 'PL'}</span></td>
            <td class="py-4 px-6">
              <div class="font-medium text-white">${item.podcast || '-'}</div>
              <div class="text-xs text-slate-400 max-w-sm truncate mt-0.5">${item.tytul || '-'}</div>
            </td>
            <td class="py-4 px-6">
              ${sponsorBadge}
              ${item.kody_rabatowe && item.kody_rabatowe !== '-' ? `<div class="text-xs text-slate-400 mt-1">Kod: <span class="text-slate-200 font-mono">${item.kody_rabatowe}</span></div>` : ''}
            </td>
            <td class="py-4 px-6">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold border ${scoreBadge}">${score}/100</span>
            </td>
            <td class="py-4 px-6 text-xs text-slate-300">${item.typ_monetyzacji || '-'}</td>
            <td class="py-4 px-6 text-xs text-slate-400 max-w-xs">${item.profil_odbiorcy || '-'}</td>
          </tr>
        `;
      }).join('');
    }

    function filterData() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const country = document.getElementById('countryFilter').value;

      const filtered = allData.filter(d => {
        const matchesQuery = (d.podcast && d.podcast.toLowerCase().includes(q)) ||
                             (d.tytul && d.tytul.toLowerCase().includes(q)) ||
                             (d.sponsorzy && d.sponsorzy.toLowerCase().includes(q));
        const matchesCountry = country === 'ALL' || d.kraj === country;
        return matchesQuery && matchesCountry;
      });

      renderTable(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', filterData);
    document.getElementById('countryFilter').addEventListener('change', filterData);

    loadData();
  </script>
</body>
</html>
